<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon PEA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app. Full screen on mobile, centred in a device frame with a caption on desktop. */
:root{
  --navy:#0b3a8c; --navy-2:#2a58ad; --navy-ink:#081d47;
  --ink:#0f1a33; --muted:#5b6478; --faint:#8a93a6;
  --bg:#eef2f8; --stage:#e6ecf6; --card:#ffffff; --line:#e3e8f1; --soft:#f1f4f9;
  --chip:#e6eefc; --green:#17804a; --green-soft:#e3f4ea; --red:#c2410c; --orange:#b45309; --orange-soft:#fdeee3;
  --on-navy:#ffffff; --on-navy-dim:#c9d6f0;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #7aa2f7;outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- stage / device ---------- */
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.caption{text-align:center;display:none}
.caption h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.caption p{margin:6px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.device{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:640px){
  .caption{display:block}
  .device{width:390px;height:min(820px,calc(100% - 120px));border-radius:46px;border:10px solid var(--navy-ink);box-shadow:0 30px 60px -20px rgba(11,58,140,.35)}
}

/* ---------- screens ---------- */
.screens{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px}

/* hero (navy band) */
.hero{background:var(--navy);color:var(--on-navy);border-radius:0 0 28px 28px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:18px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:8px;font-weight:800;letter-spacing:.04em}
.brand small{display:block;font-size:11px;color:var(--on-navy-dim)}
.brand b{display:block;font-size:14px;font-weight:700}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#ff8a4c;border:2px solid var(--navy)}
.lbl{margin:18px 0 2px;font-size:12px;color:var(--on-navy-dim)}
.big{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.gainrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--on-navy-dim);flex-wrap:wrap}
.pill-gain{background:#fff;color:var(--green);font-weight:700;border-radius:999px;padding:3px 9px;font-size:12px}
.pill-gain.neg{color:var(--red)}
.chart{display:block;width:100%;height:110px;margin-top:10px;touch-action:pan-y;cursor:crosshair}
.ranges{display:flex;gap:6px;margin-top:10px}
.ranges button{flex:1;height:30px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600}
.ranges button.on{background:#fff;color:var(--navy)}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn-w,.btn-o{height:46px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-w{background:#fff;color:var(--navy)}
.btn-o{border:1.5px solid #fff;color:#fff}

.content{padding-top:16px}
.card{background:var(--card);border-radius:20px;padding:16px}
.card.tap{text-align:left;width:100%;display:block;transition:transform .15s}
.card.tap:active{transform:scale(.985)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--navy);font-weight:700;font-size:11px;border-radius:999px;padding:4px 10px}
.card h3{margin:10px 0 4px;font-size:15px;font-weight:700;text-wrap:balance}
.card p.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{display:block}
.small-lbl{font-size:12px;color:var(--muted);margin:8px 0 4px}
.strong{font-weight:700;font-size:14px;line-height:1.3}
.mid{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .6s ease}
h2.sec{font-size:17px;font-weight:800;margin:10px 0 0;letter-spacing:-.01em}
.list{padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.av{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px}
.t-blue{background:var(--chip);color:var(--navy)} .t-orange{background:var(--orange-soft);color:var(--orange)} .t-green{background:var(--green-soft);color:var(--green)} .t-grey{background:var(--soft);color:var(--muted)}
.row .mid-col{flex:1;min-width:0}
.row .mid-col b{display:block;font-size:14px}
.row .mid-col span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{text-align:right;flex:none}
.row .right b{display:block;font-size:14px}
.up{color:var(--green);font-weight:700;font-size:12px}
.down{color:var(--red);font-weight:700;font-size:12px}

/* page titles (non-hero screens) */
.ptitle{font-size:18px;font-weight:800;margin:0;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:12px;letter-spacing:-.01em}
.navy-card{background:var(--navy);color:#fff;border-radius:20px;padding:18px}
.navy-card .k{font-size:12px;color:var(--on-navy-dim)}
.navy-card .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 8px}
.navy-card .s{font-size:12px;color:#fff}
.navy-card .xs{font-size:11px;color:var(--on-navy-dim);margin-top:8px}

/* perks hero */
.perk-hero{padding-top:calc(22px + env(safe-area-inset-top,0px))}
.perk-hero h1{margin:0 0 14px;font-size:17px;font-weight:800}
.perk-hero .k{font-size:12px;color:var(--on-navy-dim)}
.perk-hero .h{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.15;text-wrap:balance}
.perk-hero .d{font-size:12px;color:var(--on-navy-dim);line-height:1.4}
.wbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);margin:16px 0 10px;overflow:hidden}
.wbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .8s ease}
.tl{display:flex;justify-content:space-between;font-size:11px;color:var(--on-navy-dim)}
.tl div:nth-child(2){text-align:center} .tl div:last-child{text-align:right}
.tl b{display:block;color:#fff;font-weight:600}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.step b{display:block;font-size:14px;margin-bottom:3px}
.step span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.link-btn{color:var(--navy);font-weight:700;font-size:13px;margin-top:10px}

/* auto */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.chips button{height:42px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;background:#fff;transition:background .15s,color .15s}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.asset-line{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:12px;width:100%;text-align:left}
.asset-line b{display:block;font-size:13px} .asset-line span{display:block;font-size:12px;color:var(--muted)}
.asset-line .av{width:34px;height:34px;font-size:11px;border-radius:10px}
.toggle-row{display:flex;align-items:center;gap:12px}
.toggle-row>div{flex:1;min-width:0}
.switch{flex:none;width:50px;height:30px;border-radius:99px;background:#c9d0dc;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--navy)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.primary{width:100%;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;transition:background .2s}
.primary:disabled{background:#7d879b;cursor:default}
.ghost{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;color:var(--navy);background:#fff}
.danger-link{color:var(--red);font-weight:600;font-size:13px}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px max(6px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--faint)}
.nav button.on{color:var(--navy)}
.nav .fab{align-self:center}
.nav .fab span{width:50px;height:50px;border-radius:16px;background:var(--navy);display:grid;place-items:center;color:#fff;margin-top:-26px;box-shadow:0 8px 18px -6px rgba(11,58,140,.6)}

/* overlay sheet */
.sheet{position:absolute;inset:0;background:var(--card);z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-top{display:flex;align-items:center;gap:10px}
.close{flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px}
.seg button{height:36px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(15,26,51,.1)}
.sheet-title{flex:1;font-weight:800;font-size:16px}
.asset-card{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:14px;width:100%;text-align:left}
.asset-card b{display:block;font-size:14px}
.asset-card span{display:block;font-size:12px;color:var(--muted)}
.asset-card .chev{margin-left:auto;color:var(--faint)}
.asset-card span span{display:inline}
.asset-card .av,.asset-line .av{display:grid}
.asset-card .t-blue,.asset-line .t-blue{color:var(--navy)} .asset-card .t-orange,.asset-line .t-orange{color:var(--orange)} .asset-card .t-green,.asset-line .t-green{color:var(--green)}
.asset-card span.up{color:var(--green)} .asset-card span.down{color:var(--red)}
.q{text-align:center;color:var(--muted);font-weight:600;font-size:13px;margin:18px 0 2px}
.amt{text-align:center;font-size:46px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.15}
.amt.empty{color:#b9c0cd}
.parts-pill{display:table;margin:8px auto 0;background:var(--chip);color:var(--navy);font-weight:700;font-size:12px;border-radius:999px;padding:5px 12px}
.parts-pill.warn{background:var(--orange-soft);color:var(--orange)}
.info{background:var(--soft);border-radius:14px;padding:12px;margin-top:14px;font-size:12px}
.info .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--muted)}
.info .l b{color:var(--ink)}
.info p{margin:6px 0 0;color:var(--muted);line-height:1.45}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:12px 0 12px}
.keypad button{height:50px;border-radius:14px;font-size:22px;font-weight:600}
.keypad button:active{background:var(--soft)}
.spacer{flex:1}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.done .tick{width:76px;height:76px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff;margin-bottom:12px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.done h2{margin:0;font-size:24px;font-weight:800}
.done p{margin:0;max-width:30ch}
.done p.b{font-weight:600}
.done p.m{color:var(--muted);font-size:12px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.picker{position:absolute;inset:0;z-index:30;background:rgba(15,26,51,.35);display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .2s}
.picker.open{opacity:1;visibility:visible}
.picker .pk{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.picker h4{margin:0 0 6px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stats div{background:var(--soft);border-radius:14px;padding:10px 12px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:15px;margin-top:2px}
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--muted)}
.empty-note{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.confirm{background:var(--orange-soft);border-radius:14px;padding:12px;font-size:13px}
.confirm div{display:flex;gap:8px;margin-top:10px}
.confirm button{flex:1;height:38px;border-radius:10px;font-weight:700}

/* explore + asset sheet */
.t-purple{background:#efe9fb;color:#6d3fc0} .t-teal{background:#dff3f2;color:#0f7470} .t-rose{background:#fce8ee;color:#b4235a}
.av.sm{font-size:10px}
.row .mid-col b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:46px;border:1.5px solid var(--line);color:var(--faint)}
.search:focus-within{border-color:var(--navy)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--ink)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px))}
.hscroll::-webkit-scrollbar{display:none}
.idx{flex:none;width:132px;background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.idx>span:first-child{font-size:11px;color:var(--muted);font-weight:600}
.idx b{font-size:14px}
.idx .spark{margin:4px 0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;height:34px;padding:0 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13px}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.trend{flex:none;width:148px;background:var(--card);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.trend .av{width:32px;height:32px;font-size:10px;border-radius:9px}
.trend b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.spark{display:block;flex:none}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.sortlbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sort{font:inherit;font-size:13px;font-weight:700;color:var(--navy);background:transparent;border:0;padding:4px 0;cursor:pointer}
.notice{background:var(--orange-soft);color:#7a3a07;border-radius:14px;padding:12px;font-size:13px;line-height:1.45}
.m-note{text-align:center;color:var(--faint);font-size:12px;margin:2px 0}
.card.explore-cta{display:flex;align-items:center;gap:12px}
#assetBody h2.sec{margin:22px 0 10px}
.explore-cta .mid-col{flex:1;min-width:0}
.explore-cta b{display:block;font-size:14px}
.explore-cta span.s{display:block;font-size:12px;color:var(--muted)}
#assetSheet{z-index:15}
.a-head{display:flex;gap:12px;align-items:center;margin-top:12px}
.a-head b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.a-head div span{display:block;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;margin-top:10px}
.tag.ok{background:var(--green-soft);color:var(--green)} .tag.no{background:var(--orange-soft);color:var(--orange)}
.a-price{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:14px 0 0}
.a-chg{font-size:13px;margin:2px 0 0}
.a-chg .up,.a-chg .down{font-size:13px}
.muted{color:var(--muted);font-weight:500}
.achart{display:block;width:100%;height:170px;margin-top:10px;touch-action:pan-y;cursor:crosshair}
.lranges button{background:var(--soft);color:var(--muted)}
.lranges button.on{background:var(--navy);color:#fff}
.mypos{background:var(--soft);margin-top:14px}
.mypos .stats div{background:var(--card)}
.star{font-size:19px;color:var(--navy)} .star.on{color:#c98a00}
.a-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.nav .fab.on span{box-shadow:0 0 0 4px var(--chip),0 8px 18px -6px rgba(11,58,140,.6)}

/* accounts */
.brand{text-align:left;color:inherit;border-radius:12px;min-width:0}
.brand-t{display:block;min-width:0}
.brand-t b{display:flex;align-items:center;gap:4px;white-space:nowrap}
.brand-chev{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.16)}
.topbar{gap:10px}
.acc-scroll{max-height:68vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.acc-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.acc-list{padding:0}
.row.acc.on .mid-col b::after{content:" ✓";color:var(--green)}
.alloc{display:flex;flex-direction:column;gap:10px}
.alloc>div{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px}
.alloc>div span{color:var(--muted)}
.alloc .bar{grid-column:1/-1}
.tmi{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 8px}
.tmi button{height:34px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13px}
.tmi button.on{background:var(--navy);border-color:var(--navy);color:#fff}

<script>
(function(){
"use strict";

/* ---------- formatting ---------- */
const F2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const F0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const F1 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const eur = v => F2.format(v) + ' €';
const eur0 = v => F0.format(Math.round(v)) + ' €';
const sgn = v => v >= 0 ? '+' : '−';
const pct = v => sgn(v) + F1.format(Math.abs(v)) + ' %';
const tri = v => v >= 0 ? '▲' : '▼';
const r2 = v => Math.round(v * 100) / 100;
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const dShort = d => d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
const dNum = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
const de = n => /^ETF/.test(n) || (!/^[A-Z]{2}/.test(n) && /^[AEIOUYHÉÈaeiouyhéè]/.test(n)) ? 'd’' + n : 'de ' + n;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- products ---------- */
const PR = {

/* ---------- state ---------- */

    av:{deposits:16500, profile:'equilibre', alloc:{FE:60, MO:30, IM:10},
      positions:[sp('FE','€','Fonds euros','Sécurisé','blue',11052.45,10417.02,0.01), sp('MO','MO','ETF Monde','Unité de compte','orange',5526.23,4428.07,0.8), sp('IM','IM','Immobilier','Unité de compte','green',1842.07,1902.97,-0.1)],
      history:[{t: now - D*15, kind:'auto', label:'Versement programmé', detail:'Réparti 60 / 40', amount:100}, dep(120, 2000)],
      plan:null, draft:{amount:50, roundups:false},
      notifs:[{id:1, title:'Ta clause bénéficiaire est à jour', body:'2 personnes désignées. Tu peux la modifier quand tu veux.', t: now - D*6, read:false}]},
    cc:{deposits:28000, alloc:{MO:50, FE:30, IM:20},
      positions:[sp('MO','MO','ETF Monde','Unité de compte','orange',16205.45,12730.11,0.8), sp('FE','€','Fonds euros','Sécurisé','blue',9723.27,9155.62,0.01), sp('IM','IM','Immobilier','Unité de compte','green',6482.18,6759.31,-0.1)],
      history:[{t: now - D*44, kind:'arb', label:'Arbitrage', detail:'Fonds euros → ETF Monde', amount:1500}, dep(90, 3000, 'Réparti 50 / 30 / 20')],
      plan:null, draft:{amount:50, roundups:false},
      notifs:[{id:1, title:'Tes 8 ans arrivent en mars 2029', body:'Ensuite, abattement annuel sur les gains que tu retires.', t: now - D*4, read:false}]},
    per:{deposits:7000, year:3000, tmi:30, alloc:{MO:60, FE:25, OB:15},
      positions:[sp('MO','MO','ETF Monde','Unité de compte','orange',4716.18,3946.59,0.8), sp('FE','€','Fonds euros','Sécurisé','blue',1965.08,1919.02,0.01), sp('OB','OB','Obligations','Unité de compte','green',1179.04,1166.21,0.1)],
      history:[{t: now - D*25, kind:'deposit', label:'Versement déductible', detail:'Réparti 60 / 25 / 15', amount:1000}],
      plan:null, draft:{amount:50, roundups:false},
      notifs:[{id:1, title:'Verse avant le 31 décembre', body:'Tes versements 2026 se déduisent de ton revenu imposable 2026.', t: now - H*8, read:false}]}
  }};
}
let G;
try { G = JSON.parse(localStorage.getItem(KEY)); } catch(e){ G = null; }
if (!G || !G.accounts || !ORDER.every(k => G.accounts[k]) || !PR[G.active]) G = defaults();
let S = G.accounts[G.active];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(G)); } catch(e){} }

const P = () => PR[G.active];
const isShares = () => P().kind === 'shares';
const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
const pos = id => S.positions.find(p => p.id === id);
const val = p => r2(p.value != null ? p.value : p.parts * p.price);
const held = p => val(p) > 0;
const totOf = a => r2(a.positions.reduce((s,p) => s + val(p), 0) + (a.cash || 0));
const invested = () => S.positions.reduce((a,p) => a + val(p), 0);
const total = () => totOf(S);
const gain = () => r2(total() - S.deposits);
const common = () => r2(G.accounts.pea.deposits + G.accounts.pme.deposits);
const money = x => Number.isInteger(x) ? eur0(x) : eur(x);
const allocShort = () => G.active === 'av' ? S.alloc.FE + ' / ' + (100 - S.alloc.FE) : Object.values(S.alloc).join(' / ');
function depositRoom(){
  if (G.active === 'pea') return Math.min(PEA_CAP - S.deposits, COMMON_CAP - common());
  if (G.active === 'pme') return COMMON_CAP - common();
  return Infinity;
}

/* ---------- dates / counters ---------- */
function monthsBetween(a, b){
  let m = (b.getFullYear() - a.getFullYear())*12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) m--;
  return Math.max(0, m);
}
function ym(m){
  const y = Math.floor(m/12), mo = m % 12;
  const ys = y ? y + (y > 1 ? ' ans' : ' an') : '';
  const ms = mo ? mo + ' mois' : '';
  return ys && ms ? ys + ' et ' + ms : (ys || ms || 'moins d’un mois');
}
function fiscal(){
  const pr = P(), now = new Date(), open = pr.open;
  const goal = pr.retire ? new Date(pr.retire, open.getMonth(), open.getDate()) : new Date(open.getFullYear() + (pr.years || 5), open.getMonth(), open.getDate());
  const p = Math.min(1, Math.max(0, (now - open) / (goal - open)));
  return {now, open, goal, p, done: now >= goal, elapsedTxt: ym(monthsBetween(open, now)).replace(' et ', ' '), leftTxt: ym(monthsBetween(now, goal)), leftYears: goal.getFullYear() - now.getFullYear()};
}
const my = d => String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();

/* ---------- series for the chart ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RANGES = {'1S':{days:7,start:.992,vol:.004,seed:3}, '1M':{days:30,start:.978,vol:.01,seed:7}, '1A':{days:365,start:.87,vol:.03,seed:11}, '5A':{days:0,start:0,vol:.05,seed:19}, 'Tout':{days:0,start:0,vol:.05,seed:19}};
function series(key, end, seedExtra){
  const R = RANGES[key], N = 60, now = Date.now();
  const days = R.days || Math.round((now - P().open) / 86400000);
  const start = R.start ? end * R.start : Math.min(5000, end * .3);
  const rand = rng(R.seed + (seedExtra || 0) + ORDER.indexOf(G.active)*101);
  const w = [0]; for (let i = 1; i < N; i++) w.push(w[i-1] + (rand() - .5));
  const pts = [];
  for (let i = 0; i < N; i++){
    const t = i/(N-1);
    const noise = w[i] - (w[0] + (w[N-1]-w[0])*t);
    pts.push({t: now - (1-t)*days*86400000, v: Math.max(0, start + (end-start)*t + noise*end*R.vol)});
  }
  pts[N-1].v = end;
  return pts;
}
function pathFor(pts, W, H, pad){
  const vs = pts.map(p => p.v), mn = Math.min(...vs), mx = Math.max(...vs), span = (mx - mn) || 1;
  const xy = pts.map((p,i) => [i*(W/(pts.length-1)), pad + (H - 2*pad)*(1 - (p.v - mn)/span)]);
  const line = xy.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return {xy, line, area: line + ` L${W} ${H} L0 ${H} Z`};
}

/* ---------- UI state ---------- */
let view = 'home', range = '1A', firstPaint = true;
const CAPTIONS = {

const CAPS = {

  av:Object.assign({perks:['Ton compteur 8 ans, en clair','Combien de temps avant l’abattement sur tes gains']}, CONTRACT_CAPS),

  per:Object.assign({perks:['Ta retraite, en clair','Ton horizon et ton avantage fiscal']}, CONTRACT_CAPS, {order:['Verser en 3 gestes','L’app calcule ton économie d’impôt']})
};
function caption(k){ const c = (CAPS[G.active] && CAPS[G.active][k]) || CAPTIONS[k]; $('#capT').textContent = c[0]; $('#capS').textContent = c[1]; }
const $ = s => document.querySelector(s);

/* ---------- icons ---------- */
const I = {

  compass:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',

  bars:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20h14M7 16v-4M12 16V7M17 16v-6"/></svg>',

/* ---------- HOME ---------- */
function advice(){
  switch (G.active){
    case 'pea': {
      const mo = pos('MO');
      if (mo && S.cash >= mo.price) return {act:'advice-buy', tag:'Conseil malin', h:`Tu as ${eur0(S.cash)} qui dorment sur ton PEA.`, p:'Les liquidités ne rapportent rien ici. Place-les sur ton ETF Monde en 2 clics.'};

      return {act:'go-perks', tag:'Bon à savoir', h:`Ton plan de ${eur0(S.plan.amount)} par mois tourne.`, p:'Chaque versement compte dans ton plafond de 150 000 €. Regarde où tu en es.'};
    }
    case 'pme': return {act:'go-perks', tag:'Bon à savoir', h:'Ton argent finance des PME et ETI.', p:'Plus de potentiel qu’un ETF Monde, mais plus de variations. Garde un horizon long.'};

function donut(){
  const parts = S.positions.filter(held).map(p => ({label:p.name, v:val(p), c:TONE_COL[p.tone] || TONE_COL.grey}));
  if (isShares()) parts.push({label:'Liquidités', v:S.cash, c:TONE_COL.grey});

  return `<div class="donut-wrap"><svg width="104" height="104" viewBox="0 0 100 100" aria-hidden="true">${arcs}</svg>

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el, from, to, ms, f, done){
  if (!el) return;
  if (reduce){ el.textContent = f(to); done && done(); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0)/ms), e = 1 - Math.pow(1-k, 3); el.textContent = f(from + (to-from)*e); if (k < 1) requestAnimationFrame(step); else done && done(); };
  requestAnimationFrame(step);
}

function confirmOrder(){
  const q = quote(); if (!q.ok) return;
  const now = Date.now(), x = q.x, ton = P().ton;
  switch (O.mode){
    case 'simulate': O.mode = 'verse'; renderOrder(); return;
    case 'deposit':
      S.cash = r2(S.cash + x); S.deposits = r2(S.deposits + x);
      S.history.push({t:now, kind:'deposit', label:'Versement', detail:'Depuis ton compte courant', amount:x});
      O.done = {line1: money(x) + ' versés sur ' + ton, line2: 'Tes liquidités : ' + eur(S.cash) + '.', toast: '+' + money(x) + ' sur ' + ton};
      break;
    case 'verse': {
      const sp = splitAlloc(x);
      sp.forEach(s => { s.p.value = r2(s.p.value + s.v); s.p.cost = r2(s.p.cost + s.v); });
      S.deposits = r2(S.deposits + x);
      let line2;
      if (G.active === 'per'){ S.year = r2(S.year + x); line2 = `Jusqu’à ${eur0(x*S.tmi/100)} d’impôt en moins sur tes revenus ${new Date().getFullYear()} (tranche à ${S.tmi} %).`; }
      else if (G.active === 'av'){ const fe = sp.find(s => s.id === 'FE').v; line2 = `${money(fe)} sur le fonds euros, ${money(r2(x - fe))} en unités de compte.`; }
      else line2 = sp.map(s => `${money(s.v)} ${/^ETF/.test(s.p.name) ? s.p.name : lower(s.p.name)}`).join(', ') + '.';
      S.history.push({t:now, kind:'deposit', label: G.active === 'per' ? 'Versement déductible' : 'Versement', detail:'Réparti ' + allocShort(), amount:x});
      O.done = {line1: money(x) + ' versés sur ' + ton, line2, toast: '+' + money(x) + ' sur ' + ton};
      break;
    }
    case 'withdraw': {
      const ratio = x / total();
      S.positions.forEach(p => { p.value = r2(p.value*(1 - ratio)); p.cost = r2(p.cost*(1 - ratio)); });
      S.deposits = r2(S.deposits*(1 - ratio));
      S.history.push({t:now, kind:'withdraw', label:'Retrait', detail:'Vers ton compte courant', amount:-x});
      O.done = {line1: money(x) + ' retirés de ' + ton, line2: 'L’argent arrive sur ton compte courant. Ton contrat reste ouvert.', toast: money(x) + ' retirés de ' + ton};
      break;
    }
    case 'arb': {
      const {from, to} = q;
      from.cost = r2(from.cost*(1 - x/val(from))); from.value = r2(from.value - x);
      to.value = r2(to.value + x); to.cost = r2(to.cost + x);
      S.history.push({t:now, kind:'arb', label:'Arbitrage', detail:`${from.name} → ${to.name}`, amount:x});
      O.done = {line1: money(x) + ' arbitrés', line2: `De ${from.name} vers ${lower(to.name).replace(/^etf/, 'ETF')}. Pas d’impôt : l’argent reste dans ton contrat.`, toast: money(x) + ' arbitrés vers ' + to.name};
      break;
    }
    case 'buy': {
      const a = q.a; a.parts += q.n; a.cost = r2(a.cost + q.cost); S.cash = r2(S.cash - q.cost);
      S.history.push({t:now, kind:'buy', label:'Achat · ' + q.n + (q.n>1?' parts':' part'), detail:a.name, amount:-q.cost});
      O.done = {line1: `${q.n} ${q.n>1?'parts':'part'} ${de(a.name)} ${q.n>1?'achetées':'achetée'} pour ${eur(q.cost)}`, line2: `Il te reste ${eur(S.cash)} de liquidités.`, toast: `+${q.n} ${q.n>1?'parts':'part'} ${de(a.name)} dans ${ton}`};
      break;
    }
    case 'sell': {
      const a = q.a, basis = r2(a.cost * q.n / a.parts), pnl = r2(q.cost - basis);
      if (S.realized != null){ if (pnl >= 0) S.realized = r2(S.realized + pnl); else S.losses = r2(S.losses - pnl); }
      a.cost = r2(a.cost - basis); a.parts -= q.n; S.cash = r2(S.cash + q.cost);
      S.history.push({t:now, kind:'sell', label:'Vente · ' + q.n + (q.n>1?' parts':' part'), detail:a.name, amount:q.cost});
      O.done = {line1: `${q.n} ${q.n>1?'parts':'part'} ${de(a.name)} ${q.n>1?'vendues':'vendue'} pour ${eur(q.cost)}`,
        line2: S.realized != null ? `${pnl >= 0 ? 'Plus-value' : 'Moins-value'} de ${eur(Math.abs(pnl))}. Tes liquidités : ${eur(S.cash)}.` : `Tes liquidités : ${eur(S.cash)}.`,
        toast: `${eur(q.cost)} ajoutés à tes liquidités`};
      break;
    }
  }
  save(); renderOrder(); render(); if (assetOpen()) renderAsset();
}

/* price history: seeded random walk pinned to the displayed variations */
const AR = {'1J':{n:78,amp:.02,days:0}, '1S':{n:40,amp:.04,days:7}, '1M':{n:44,amp:.08,days:30}, '1A':{n:60,amp:.25,days:365}, '5A':{n:60,amp:.4,days:1826}};
const TYPE_VOL = {etf:.6, action:1, oblig:.15};
const serCache = {};
function assetSeries(a, k){
  const ck = a.id + k;
  if (serCache[ck] && serCache[ck].end === a.price) return serCache[ck].pts;
  const R = AR[k], rand = rng(hash(ck)), vol = TYPE_VOL[a.type];
  const drift = (rand() - .45) * vol;
  const chg = {'1J':a.day, '1S':a.day + drift*3, '1M':a.p1a/12 + drift*6, '1A':a.p1a, '5A':a.p5a}[k];
  const end = a.price, start = end / (1 + chg/100);
  const now = new Date();
  const t0 = k === '1J' ? new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0).getTime() : now.getTime() - R.days*86400000;
  const t1 = k === '1J' ? t0 + 8.5*3600000 : now.getTime();
  const w = [0]; for (let i = 1; i < R.n; i++) w.push(w[i-1] + (rand() - .5));
  const sc = R.amp * vol * end / Math.sqrt(R.n) * 2;
  const pts = [];
  for (let i = 0; i < R.n; i++){
    const t = i/(R.n-1), noise = w[i] - (w[0] + (w[R.n-1]-w[0])*t);
    pts.push({t: t0 + (t1-t0)*t, v: Math.max(end*.05, start + (end-start)*t + noise*sc)});
  }
  pts[R.n-1].v = end;
  serCache[ck] = {end, pts};
  return pts;
}

}

/* ---------- ASSET SHEET ---------- */
const AS = {id:null, range:'1A'};
const RLBL = {'1J':'aujourd’hui', '1S':'sur 1 semaine', '1M':'sur 1 mois', '1A':'sur 1 an', '5A':'sur 5 ans'};
function openAsset(id){ AS.id = id; AS.range = '1A'; renderAsset(); $('#assetSheet').classList.add('open'); $('#assetBody').scrollTop = 0; }
function closeAsset(){ $('#assetSheet').classList.remove('open'); }
const assetOpen = () => $('#assetSheet').classList.contains('open');
function renderAsset(){
  const a = mk(AS.id) || pos(AS.id), p = isShares() ? pos(a.id) : null, held = !!(p && p.parts > 0);
  const ek = isShares() ? G.active : 'pea', ok = elig(a, ek);
  const pts = assetSeries(a, AS.range), first = pts[0].v, chg = (a.price/first - 1)*100;
  const y = assetSeries(a, '1A').map(x => x.v), hi = Math.max(...y), lo = Math.min(...y);
  const fav = G.favs.includes(a.id);
  const common = [['Plus haut 1 an', fmtPrice(a, hi)], ['Plus bas 1 an', fmtPrice(a, lo)], ['Perf. 1 an', pct(a.p1a)], ['Perf. 5 ans', pct(a.p5a)]];
  const stats = a.type === 'etf' ? [['Frais annuels', F2.format(a.ter) + ' %'], ['Encours', big(a.aum/1000)], ['Entreprises', F0.format(a.lines)], ['Dividendes', 'Réinvestis']]
    : a.type === 'action' ? [['Capitalisation', big(a.cap)], ['PER', a.per ? F1.format(a.per) : '—'], ['Rendement', a.dy ? F1.format(a.dy) + ' %' : 'Aucun'], ['Pays', a.country]]
    : [['Coupon', a.coupon ? F2.format(a.coupon) + ' %' : '—'], ['Échéance', a.mat], ['Rendement', F2.format(a.ytm) + ' %'], ['Notation', a.rating]];
  const about = a.type === 'etf' ? `Un seul achat pour ${F0.format(a.lines)} entreprises de l’indice ${a.sub}. ${F2.format(a.ter)} % de frais par an, dividendes réinvestis automatiquement. ${a.eligible ? 'Éligible au PEA.' : 'Disponible sur compte-titres.'}`
    : a.type === 'action' ? esc(a.d) + ` Entreprise cotée (${a.country}), éligible au PEA.`
    : a.coupon ? `Obligation émise par ${/^État/.test(a.sub) ? 'l’' + a.sub : a.sub}. Elle verse ${F2.format(a.coupon)} % d’intérêts par an jusqu’au ${a.mat}. Le prix est exprimé en % de la valeur de remboursement.`
    : `Fonds qui regroupe des centaines d’obligations d’États et d’entreprises de la zone euro. Non éligible au PEA.`;
  const {xy, line, area} = pathFor(pts, 340, 170, 12);
  $('#assetBody').innerHTML = `
    <div class="sheet-top"><button class="close" data-act="close-asset" aria-label="Fermer">${I.x}</button><span class="spacer"></span>
      <button class="close star ${fav?'on':''}" data-act="fav" aria-pressed="${fav}" aria-label="${fav?'Retirer des favoris':'Ajouter aux favoris'}">${fav?'★':'☆'}</button></div>
    <div class="a-head">${avatar(a)}<div style="min-width:0"><b>${esc(a.name)}</b><span>${esc(a.sub)}${a.country ? ' · ' + a.country : ''}</span></div></div>
    <div class="tags"><span class="tag">${TYPE_LBL[a.type]}</span><span class="tag ${ok?'ok':'no'}">${ok ? 'Éligible ' : 'Hors '}${ELIG_LBL[ek]}</span></div>
    <p class="a-price num" id="aPrice">${fmtPrice(a)}</p>
    <p class="a-chg num" id="aChg">${chgSpan(chg)} <span class="muted">${RLBL[AS.range]}</span></p>
    <svg class="achart" id="achart" data-scrub viewBox="0 0 340 170" preserveAspectRatio="none" role="img" aria-label="Cours ${RLBL[AS.range]}">
      <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${chg>=0?'#17804a':'#c2410c'}" stop-opacity=".18"/><stop offset="1" stop-color="${chg>=0?'#17804a':'#c2410c'}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="340" y1="${xy[0][1].toFixed(1)}" y2="${xy[0][1].toFixed(1)}" stroke="var(--faint)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="${area}" fill="url(#gb)"/><path d="${line}" fill="none" stroke="${chg>=0?'var(--green)':'var(--red)'}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <line class="scrubL" x1="0" x2="0" y1="0" y2="170" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>
    <div class="ranges lranges" role="tablist">${Object.keys(AR).map(k => `<button role="tab" aria-selected="${k===AS.range}" data-act="a-range" data-r="${k}" class="${k===AS.range?'on':''}">${k}</button>`).join('')}</div>
    ${held ? `<div class="card mypos"><p class="strong" style="margin:0 0 8px">Ma position</p><div class="stats num" style="margin:0"><div><span>Parts</span><b>${p.parts}</b></div><div><span>Valeur</span><b>${eur(val(p))}</b></div><div><span>Prix moyen d’achat</span><b>${eur(p.cost/p.parts)}</b></div><div><span>Plus-value</span><b>${chgSpan((val(p)/p.cost - 1)*100)}</b></div></div></div>` : ''}
    <h2 class="sec">Chiffres clés</h2>
    <div class="stats num" style="margin-top:0">${stats.concat(common).map(([l,v]) => `<div><span>${l}</span><b>${esc(v)}</b></div>`).join('')}</div>
    <h2 class="sec">À propos</h2><p class="sub" style="margin:0">${about}</p>
    <p class="m-note" style="margin-top:6px">Cours fictifs, pour la démo.</p>`;
  const target = elig(a, 'pea') ? 'pea' : 'ct';
  $('#assetFoot').innerHTML = isShares() && ok
    ? `<button class="primary" data-act="a-buy">Acheter</button><button class="ghost" data-act="a-sell" ${held?'':'disabled'}>Vendre</button>`
    : `<button class="primary" data-act="buy-on" data-k="${target}" style="grid-column:1/-1">Acheter sur ${lower(PR[target].name)}</button>`;
  charts.achart = {pts, W:340,
    move: q => { $('#aPrice').textContent = fmtPrice(a, q.v); $('#aChg').innerHTML = chgSpan((q.v/first - 1)*100) + ` <span class="muted">${AS.range === '1J' ? 'à ' + new Date(q.t).toTimeString().slice(0,5) : 'le ' + dShort(new Date(q.t))}</span>`; },
    leave: () => { if (!$('#aPrice')) return; $('#aPrice').textContent = fmtPrice(a); $('#aChg').innerHTML = chgSpan(chg) + ` <span class="muted">${RLBL[AS.range]}</span>`; }};
}

/* ---------- chart scrubbing (home + asset) ---------- */
const charts = {};
function chartMove(e){
  const svg = e.target.closest && e.target.closest('svg[data-scrub]'); if (!svg) return;
  const c = charts[svg.id]; if (!c || !c.pts.length) return;
  const b = svg.getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - b.left)/b.width));
  c.move(c.pts[Math.round(x*(c.pts.length-1))]);
  const l = svg.querySelector('.scrubL'); if (l){ l.setAttribute('x1', x*c.W); l.setAttribute('x2', x*c.W); l.setAttribute('visibility', 'visible'); }
}
function chartLeave(svg){
  const c = charts[svg.id]; if (c) c.leave();
  const l = svg.querySelector('.scrubL'); if (l) l.setAttribute('visibility', 'hidden');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b){ if (e.target.id === 'picker') closePicker(); return; }
  if (b.disabled) return;
  const act = b.dataset.act;
  switch (act){
    case 'go': go(b.dataset.v); break;
    case 'go-auto': go('auto'); break;
    case 'go-perks': go('perks'); break;
    case 'go-wallet': go('wallet'); break;
    case 'range': range = b.dataset.r; document.querySelectorAll('.ranges button').forEach(x => { x.classList.toggle('on', x.dataset.r === range); x.setAttribute('aria-selected', x.dataset.r === range); }); drawChart(); break;
    case 'accounts': accountsPanel(); break;
    case 'switch': switchAccount(b.dataset.k); break;
    case 'buy': openOrder('buy'); break;
    case 'sell': openOrder('sell'); break;
    case 'deposit': openOrder('deposit'); break;
    case 'verse': closePicker(); openOrder('verse'); break;
    case 'withdraw': openOrder('withdraw'); break;
    case 'arb': openOrder('arb'); break;
    case 'arb-from': closePicker(); openOrder('arb', b.dataset.id); break;
    case 'simulate': openOrder('simulate'); break;
    case 'advice-buy': openOrder('buy', 'MO', Math.floor(S.cash)); break;
    case 'notifs': notifPanel(); break;
    case 'support': supportDetail(b.dataset.id); break;
    case 'profile': {
      const pf = PROFILES[b.dataset.p]; S.profile = b.dataset.p; S.alloc = Object.assign({}, pf.alloc); save(); renderWallet();
      toast(`Profil ${lower(pf.label)} : ${S.alloc.FE} / ${100 - S.alloc.FE}`); break;
    }
    case 'tmi': S.tmi = +b.dataset.v; save(); renderOrder(); break;
    case 'asset': closePicker(); openAsset(b.dataset.id); break;
    case 'close-asset': closeAsset(); break;
    case 'a-range': AS.range = b.dataset.r; renderAsset(); break;
    case 'a-buy': openOrder('buy', AS.id); break;
    case 'a-sell': openOrder('sell', AS.id); break;
    case 'buy-on': switchAccount(b.dataset.k, true); renderAsset(); openOrder('buy', AS.id); break;
    case 'fav': { const i = G.favs.indexOf(AS.id); if (i < 0){ G.favs.push(AS.id); toast(info(AS.id).name + ' ajouté aux favoris'); } else G.favs.splice(i, 1); save(); renderAsset(); if (view === 'explore') renderExploreList(); break; }
    case 'ex-type': EX.type = b.dataset.t; document.querySelectorAll('.filters button').forEach(x => { x.classList.toggle('on', x.dataset.t === EX.type); x.setAttribute('aria-selected', x.dataset.t === EX.type); }); renderExploreList(); break;
    case 'explore-from-order': closePicker(); closeSheet(); closeAsset(); go('explore'); break;
    case 'close': closeSheet(); break;
    case 'close-picker': closePicker(); break;
    case 'mode': setMode(b.dataset.m); break;
    case 'key': key(b.dataset.k); break;
    case 'max': {
      const x = O.mode === 'buy' ? Math.floor(S.cash*100)/100 : O.mode === 'arb' ? val(pos(O.asset)) : val(pos(O.asset));
      O.input = F2.format(x).replace(/[\s  ]/g,'').replace(/,00$/,''); renderOrder(); break;
    }
    case 'preset': O.input = b.dataset.v; renderOrder(); break;
    case 'confirm': confirmOrder(); break;
    case 'back-home': { const t = O.done && O.done.toast; closeAsset(); closeSheet(); go('home'); if (t) setTimeout(() => toast(t), 250); break; }
    case 'pick-order': assetPicker('order'); break;
    case 'pick-auto': assetPicker('auto'); break;
    case 'pick-from': assetPicker('from'); break;
    case 'pick-to': assetPicker('to'); break;
    case 'pick': {
      const id = b.dataset.id;
      if (pickTarget === 'auto'){ S.draft.asset = id; save(); closePicker(); renderAuto(); }
      else if (pickTarget === 'from'){ O.asset = id; if (O.to === id) O.to = S.positions.find(p => p.id !== id).id; closePicker(); renderOrder(); }
      else if (pickTarget === 'to'){ O.to = id; closePicker(); renderOrder(); }
      else { ensurePos(id); O.asset = id; closePicker(); renderOrder(); }
      break;
    }
    case 'amt': {
      const from = S.draft.amount*120; S.draft.amount = +b.dataset.v; save(); autoShown = from; renderAuto(); autoShown = null;
      countUp($('#autoTot'), from, S.draft.amount*120, 700, eur0); break;
    }
    case 'roundups': S.draft.roundups = !S.draft.roundups; save(); renderAuto(); break;
    case 'launch': {
      const sh = isShares();
      S.plan = {amount:S.draft.amount, asset:S.draft.asset, roundups:S.draft.roundups, since:Date.now()};
      S.notifs.push({id:Date.now(), title: sh ? 'Plan automatique activé' : 'Versements programmés activés', body:`${S.plan.amount} € sur ${sh ? info(S.plan.asset).name : lower(P().name)}, le 5 de chaque mois.`, t:Date.now(), read:false});
      save(); renderAuto(); toast(`${S.plan.amount} € ${sh ? 'investis' : 'versés'} chaque 5 du mois`); break;
    }
    case 'stop-plan': S.plan = null; save(); renderAuto(); toast(isShares() ? 'Plan automatique arrêté' : 'Versements programmés arrêtés'); break;
    case 'reset': confirmReset = true; renderWallet(); break;
    case 'reset-no': confirmReset = false; renderWallet(); break;
    case 'reset-yes': G = defaults(); S = G.accounts[G.active]; save(); confirmReset = false; firstPaint = true; setNav(); go('home'); toast('Démo réinitialisée'); break;
  }
});
document.addEventListener('pointermove', chartMove);
document.addEventListener('pointerout', e => { const svg = e.target.closest && e.target.closest('svg[data-scrub]'); if (svg && !(e.relatedTarget && svg.contains(e.relatedTarget))) chartLeave(svg); });
document.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') document.querySelectorAll('svg[data-scrub]').forEach(chartLeave); });
document.addEventListener('input', e => { if (e.target.id === 'exq'){ EX.q = e.target.value; renderExploreList(); } });
document.addEventListener('change', e => { if (e.target.id === 'exSort'){ EX.sort = e.target.value; renderExploreList(); } });
document.addEventListener('keydown', e => {
  if (!$('#sheet').classList.contains('open') || O.done){
    if (e.key === 'Escape'){ if ($('#picker').classList.contains('open')) closePicker(); else if (assetOpen() && !$('#sheet').classList.contains('open')) closeAsset(); else closeSheet(); }
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (/^[0-9]$/.test(e.key)) key(e.key);
  else if (e.key === ',' || e.key === '.') key(',');
  else if (e.key === 'Backspace') key('⌫');
  else if (e.key === 'Enter') confirmOrder();
  else if (e.key === 'Escape'){ if ($('#picker').classList.contains('open')) closePicker(); else closeSheet(); }
});

setNav();

go('home');
})();
</script>
